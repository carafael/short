# Fly.io configuration for Nexus Assistant
# Deploy with: flyctl launch

app = "nexus-assistant"
primary_region = "iad"  # Change to your preferred region

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  NEXUS_DATA_DIR = "/data/.nexus"
  NEXUS_LOG_LEVEL = "INFO"

# Persistent storage for sessions, contexts, and tasks
[mounts]
  source = "nexus_data"
  destination = "/data"
  initial_size = "1gb"

# Health checks
[checks]
  [checks.nexus_alive]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    type = "tcp"
    port = 8080

# VM configuration (free tier)
[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Keep the app running
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
